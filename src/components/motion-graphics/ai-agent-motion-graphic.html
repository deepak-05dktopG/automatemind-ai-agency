<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutomateMind – AI Agent Workflow</title>
<style>
  /* Page chrome for previewing only. The graphic itself is transparent. */
  html,body{margin:0;background:transparent;}
  body{min-height:100vh;display:grid;place-items:center;}
  .stage{width:min(100%,1600px);}
</style>
<style>
/*
 * AgentWorkflowAnimation — static baseline styles.
 *
 * Everything here describes the FINAL ("result delivered") frame. This is what
 * visitors with `prefers-reduced-motion: reduce` see. The animated timeline
 * (see animation.js) is injected inside `@media (prefers-reduced-motion:
 * no-preference)` and overrides these values frame by frame.
 *
 * All selectors are scoped under `.amw`, so nothing leaks into the page.
 * Background is intentionally transparent: the component has no outer panel.
 */

.amw-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  background: transparent;
}

.amw {
  display: block;
  width: 100%;
  height: 100%;
  font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

/* ---------- typography ---------- */
.amw text { fill: #e8f0ff; }
.amw .amw-t-title { font-size: 25px; font-weight: 650; }
.amw .amw-t-row { font-size: 19px; font-weight: 500; }
.amw .amw-t-row-s { font-size: 18px; font-weight: 500; }
.amw .amw-t-msg { font-size: 20px; font-weight: 500; }
.amw .amw-t-src { font-size: 20px; font-weight: 600; text-anchor: middle; }
.amw .amw-t-micro { font-size: 15px; font-weight: 500; fill: #b4c8f1; }
.amw .amw-t-dark { font-size: 16px; font-weight: 700; fill: #16254d; }
.amw .amw-t-cap { font-size: 21px; font-weight: 600; text-anchor: middle; }
.amw .amw-t-num { font-size: 23px; font-weight: 700; fill: #ffc247; text-anchor: middle; }
.amw .amw-t-tl { font-size: 28px; font-weight: 700; letter-spacing: 0.09em; fill: #dbe7ff; text-anchor: middle; }
.amw .amw-t-desc { font-size: 17px; fill: #b4c8f1; text-anchor: middle; }
.amw .amw-mid { text-anchor: middle; }

/* ---------- surfaces ---------- */
.amw .amw-glass { fill: rgba(15, 28, 64, 0.5); stroke: rgba(122, 166, 255, 0.28); stroke-width: 1.5; }
.amw .amw-glass-soft { fill: rgba(255, 255, 255, 0.045); stroke: rgba(122, 166, 255, 0.2); stroke-width: 1.2; }
.amw .amw-hl,
.amw .amw-srch,
.amw .amw-tth { fill: none; stroke: #ffc247; stroke-width: 2.5; opacity: 0; }
.amw .amw-sel { fill: rgba(255, 194, 71, 0.1); stroke: #ffc247; stroke-width: 2.5; opacity: 0; }

/* ---------- robot ---------- */
.amw .amw-eye { fill: none; stroke: #4de3ff; stroke-width: 13; stroke-linecap: round; }
.amw .amw-eye-glow { fill: none; stroke: #4de3ff; stroke-width: 24; stroke-linecap: round; opacity: 0.22; }
.amw .amw-ring { fill: none; stroke: #ffc247; stroke-width: 3; opacity: 0; }
.amw .amw-armL { transform: rotate(10deg); transform-box: fill-box; transform-origin: 50% 4%; }
.amw .amw-armR { transform: rotate(-38deg); transform-box: fill-box; transform-origin: 50% 4%; }
.amw .amw-card {
  scale: 1.1;
  transform-box: fill-box;
  transform-origin: center;
}

/* ---------- wires ---------- */
.amw .amw-line { opacity: 0.7; }
.amw .amw-wire { fill: none; stroke: #ffc247; stroke-width: 3; stroke-linecap: round; }
.amw .amw-wire-glow { fill: none; stroke: #ffc247; stroke-width: 9; stroke-linecap: round; opacity: 0.16; }
.amw .amw-pulse {
  fill: none; stroke: #fff3cf; stroke-width: 5; stroke-linecap: round;
  stroke-dasharray: 8 100; stroke-dashoffset: 8; opacity: 0;
}

/* ---------- status / badges (final frame) ---------- */
.amw .amw-badge { opacity: 0; }
.amw .amw-mag { opacity: 0; }
.amw .amw-dot { fill: #3ddc97; }
.amw .amw-cap { opacity: 0; }
.amw .amw-cap-6 { opacity: 1; }

/* ---------- bottom timeline ---------- */
.amw .amw-tl-base { fill: none; stroke: rgba(255, 194, 71, 0.4); stroke-width: 2; stroke-dasharray: 2 9; stroke-linecap: round; }
.amw .amw-prog { fill: none; stroke: #ffc247; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
.amw .amw-node { fill: rgba(10, 18, 42, 0.85); stroke: rgba(255, 194, 71, 0.55); stroke-width: 2; }
.amw .amw-nodeon { fill: rgba(255, 194, 71, 0.2); stroke: #ffc247; stroke-width: 3; }

.amw .amw-spark { fill: #ffc247; opacity: 0.55; }

/* ---------- responsive: drop secondary text before it becomes unreadable ---------- */
@container (max-width: 820px) {
  .amw .amw-t-title { font-size: 21px; }
  .amw .amw-t-row { font-size: 16px; }
  .amw .amw-t-row-s { font-size: 15px; }
  .amw .amw-t-msg { font-size: 17px; }
  .amw .amw-t-src { font-size: 17px; }
  .amw .amw-t-micro { font-size: 13px; }
  .amw .amw-t-dark { font-size: 14px; }
  .amw .amw-t-cap { font-size: 18px; }
  .amw .amw-t-num { font-size: 20px; }
  .amw .amw-t-tl { font-size: 24px; }
  .amw .amw-t-desc { display: none; }
  .amw .amw-card { scale: 1.06; }
}
@container (max-width: 560px) {
  .amw .amw-t-title { font-size: 18px; }
  .amw .amw-t-row { font-size: 13px; }
  .amw .amw-t-row-s { font-size: 12px; }
  .amw .amw-t-msg { font-size: 14px; }
  .amw .amw-t-src { font-size: 14px; }
  .amw .amw-t-micro { display: none; }
  .amw .amw-t-dark { font-size: 12px; }
  .amw .amw-t-cap { font-size: 15px; }
  .amw .amw-t-num { font-size: 17px; }
  .amw .amw-t-tl { font-size: 21px; }
  .amw .amw-t-desc { display: none; }
  .amw .amw-card { scale: 1.03; }
}

/* ---------- performance: freeze when scrolled out of view ---------- */
.amw-wrap[data-paused='true'] .amw * { animation-play-state: paused !important; }

</style>
</head>
