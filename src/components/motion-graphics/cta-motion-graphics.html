<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>AutomateMind – The First Step Starts Here</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#d1a85d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:#0a1220;color:#f5efe2;font-family:Manrope,system-ui,sans-serif}
.pre{height:60vh;display:grid;place-items:center;color:#6f7a8a;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.rp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;font:700 12px Manrope;background:#ffffff14;color:#e8e4da;border:1px solid #ffffff2a;border-radius:99px;padding:8px 14px;cursor:pointer}
/* ================= CTA SECTION ================= */
.cta{position:relative;isolation:isolate;overflow:hidden;min-height:640px;background:radial-gradient(ellipse at 30% 40%,#14223a 0,transparent 60%),linear-gradient(160deg,#0b1424,#0f1c30 60%,#101d2c)}
.grid{position:absolute;inset:-48px;z-index:0;background:linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/48px 48px;-webkit-mask:radial-gradient(ellipse at 40% 50%,#000 20%,transparent 75%);mask:radial-gradient(ellipse at 40% 50%,#000 20%,transparent 75%)}
.trail{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.trail path{fill:none;stroke:var(--gold);stroke-width:1.1}
.trail .b{stroke-dasharray:1;stroke-opacity:.28}.trail .c{stroke-dasharray:.07 1;stroke-dashoffset:-1;stroke:#f0d594;stroke-width:1.6;stroke-linecap:round}
.shapew{position:absolute;top:0;bottom:0;right:0;width:46%;z-index:2;filter:drop-shadow(-24px 0 36px #000a)}
.shape{position:absolute;inset:0;overflow:hidden;clip-path:polygon(24% 0,100% 0,100% 100%,0 100%);background:repeating-linear-gradient(115deg,#ffffff12 0 1px,transparent 1px 26px),linear-gradient(135deg,#ecca82,#c9a051 55%,#a97f35)}
.shape:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff6 50%,transparent 65%)}
.mas{position:absolute;z-index:1;top:14%;left:calc(100% - 46% + 10.8% - 124px);width:170px}.mas svg{width:100%;display:block;overflow:visible}
.mi{rotate:-2deg;transform-origin:50% 100%}.al,.ar{transform-box:fill-box;transform-origin:50% 10%}.al{rotate:22deg}
.eye{transform-box:fill-box;transform-origin:center}.ey{translate:-2px 0}.ant{transform-box:fill-box;transform-origin:center}
.cta-in{position:relative;width:min(52%,600px);margin-left:max(40px,calc((100% - 1200px)/2 + 40px));min-height:640px;padding:96px 0;display:flex;flex-direction:column;justify-content:center}
h2{font:600 clamp(2.5rem,4.6vw,4.4rem)/1.03 'Cormorant Garamond',Georgia,serif;margin:0 0 22px;letter-spacing:-.005em}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}.w>span{display:inline-block}
.desc{margin:0 0 34px;color:#aab1bd;font-size:clamp(14px,1.25vw,17px);line-height:1.6;font-weight:600;max-width:46ch}
.btnw{position:relative;display:inline-block;border-radius:99px;margin-bottom:22px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.7em;padding:17px 32px;border-radius:99px;background:linear-gradient(180deg,#e6c47a,#c49a4c);color:#1a1405;font:700 15px Manrope;text-decoration:none;box-shadow:0 10px 30px #d1a85d33}
.btn .sw{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 50%,transparent 70%);translate:-130% 0;pointer-events:none}
.btn .ar{display:inline-block;transition:translate .35s cubic-bezier(.3,1.4,.5,1)}
.btn:hover .sw,.btn:focus-visible .sw{translate:130% 0;transition:translate .9s ease}.btn:hover .ar,.btn:focus-visible .ar{translate:6px 0}
.btn:focus-visible{outline:2px solid #f0d594;outline-offset:5px}
.btnw:before,.btnw:after{content:"";position:absolute;inset:0;border-radius:99px;outline:1px solid var(--gold);outline-offset:0;opacity:0;pointer-events:none}
.btnw:hover:before,.btnw:focus-within:before{animation:ring 1.1s ease-out}.btnw:hover:after,.btnw:focus-within:after{animation:ring2 1.3s ease-out .22s}
.sub{margin:0;color:#7f8a9a;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.pw{position:absolute;left:100%;top:50%;width:min(30vw,420px);height:0;transform-origin:0 50%;rotate:var(--a);pointer-events:none}
.pw b{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,#d1a85dd9,#d1a85d00);transform-origin:100% 50%}
/* ===== motion (base = final state; hidden-before only when motion is allowed) ===== */
@media (prefers-reduced-motion:no-preference){
.cta:not([data-on]) :is(.rv,.mas,.trail,.grid){opacity:0}.cta:not([data-on]) .w>span{transform:translateY(105%)}.cta:not([data-on]) .shape{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}.cta:not([data-on]) .pw b{scale:0 1}
[data-on] .grid{animation:gin 7s cubic-bezier(.2,.7,.2,1) backwards}
[data-on] .shape{animation:shp 1.5s cubic-bezier(.65,0,.2,1) .1s backwards}[data-on] .shape:after{animation:sheen 2.4s ease-in-out 1.2s backwards}
[data-on] .trail .b{animation:td 2.6s ease-out calc(var(--d)*1s) backwards}[data-on] .trail .c{animation:cm 2.8s cubic-bezier(.4,0,.3,1) calc(var(--d)*1s) backwards}
[data-on] .w>span{animation:wu .95s cubic-bezier(.2,.9,.2,1) calc(.9s + var(--i)*.09s) backwards}
[data-on] .rv{animation:rvu .8s ease-out calc(var(--d)*1s) backwards}
[data-on] .mas{animation:peek 1.2s cubic-bezier(.3,1.4,.5,1) 1.7s backwards}
[data-on] .mi{animation:lean 3.2s ease-in-out 2.4s backwards}[data-on] .ey{animation:gaze 4.6s ease-in-out 2.6s backwards}
[data-on] .al{animation:armL 4.6s ease-in-out 2.8s backwards}[data-on] .eye{animation:blk 5.3s ease-in-out 3.4s infinite}[data-on] .ant{animation:aglow 1.2s ease-out 7s backwards}
[data-on] .pw b{animation:pwg 1.6s cubic-bezier(.4,0,.2,1) calc(var(--d)*1s) backwards}
[data-off] *{animation-play-state:paused!important}}
@keyframes gin{from{opacity:0;translate:-48px -48px}}
@keyframes shp{from{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}}@keyframes sheen{from{translate:-130% 0}to{translate:130% 0}}
@keyframes td{from{stroke-dashoffset:1}}@keyframes cm{from{stroke-dashoffset:.07}to{stroke-dashoffset:-1}}
@keyframes wu{from{transform:translateY(105%)}}@keyframes rvu{from{opacity:0;transform:translateY(14px)}}
@keyframes peek{0%{opacity:0;transform:translateX(38%) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes lean{from{rotate:7deg}}@keyframes gaze{0%,10%{translate:3px 0}30%{translate:-4px 0}55%,70%{translate:-3px 3px}100%{translate:-2px 0}}
@keyframes armL{0%,12%{rotate:0deg}30%{rotate:76deg}40%{rotate:62deg}50%{rotate:78deg}60%{rotate:64deg}70%{rotate:76deg}100%{rotate:22deg}}
@keyframes blk{0%,40%,46%,86%,90%,100%{transform:none}43%,88%{transform:scaleY(.08)}}@keyframes aglow{50%{scale:1.7}}
@keyframes pwg{from{scale:0 1}}@keyframes ring{from{opacity:.8;outline-offset:0}to{opacity:0;outline-offset:16px}}@keyframes ring2{from{opacity:.55;outline-offset:0}to{opacity:0;outline-offset:30px}}
@media (min-width:768px) and (max-width:1100px){.cta-in{width:52%}.shapew{width:42%}.mas{width:130px;left:calc(100% - 42% + 9.5% - 94px)}.pw{width:22vw}}
/* ================= MOBILE: compact diagonal base, stacked content, full-width CTA ================= */
@media (max-width:767.98px){
.cta{min-height:0}.cta-in{width:auto;margin:0;min-height:0;padding:64px 22px 250px}
.shapew{top:auto;left:0;right:0;width:auto;height:140px;filter:drop-shadow(0 -14px 22px #0009)}
.shape{clip-path:polygon(0 45%,100% 0,100% 100%,0 100%)}
.cta:not([data-on]) .shape{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}@keyframes shp{from{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}}
.mas{top:auto;bottom:84px;left:auto;right:9%;width:128px}
h2{font-size:clamp(2.3rem,10vw,3rem)}.desc{margin-bottom:46px}
.btnw{display:block;margin-bottom:20px}.btn{width:100%;justify-content:center;padding:19px 24px}
.pw{left:50%;top:auto;bottom:100%;width:1px;height:42px;transform-origin:50% 100%}.pw b{inset:0 auto;width:1px;height:100%;background:linear-gradient(0deg,#d1a85dd9,#d1a85d00);transform-origin:50% 0}
@keyframes pwg{from{scale:1 0}}.cta:not([data-on]) .pw b{scale:1 0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="pre">Scroll to the final CTA ↓</div>
<section class="cta" id="cta" aria-labelledby="cta-h">
 <div class="grid" aria-hidden="true"></div>
 <svg class="trail" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <path class="b" pathLength="1" style="--d:.3" d="M-40 560C260 470 520 380 780 270S1200 90 1480 30"/><path class="c" pathLength="1" style="--d:.6" d="M-40 560C260 470 520 380 780 270S1200 90 1480 30"/>
  <path class="b" pathLength="1" style="--d:.5" d="M-40 640C300 560 560 470 820 360S1240 170 1480 110"/><path class="c" pathLength="1" style="--d:1.1" d="M-40 640C300 560 560 470 820 360S1240 170 1480 110"/>
  <path class="b" pathLength="1" style="--d:.7" d="M-40 470C240 380 470 300 720 190S1140 10 1480 -30"/><path class="c" pathLength="1" style="--d:1.6" d="M-40 470C240 380 470 300 720 190S1140 10 1480 -30"/>
 </svg>
 <div class="mas" aria-hidden="true"><div class="mi"><svg viewBox="0 0 100 120"><defs><radialGradient id="mg" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffa58e"/><stop offset="1" stop-color="#e0553f"/></radialGradient></defs>
<ellipse cx="50" cy="116" rx="27" ry="4" fill="#000" opacity=".4"/><line x1="50" y1="22" x2="50" y2="9" stroke="#e0553f" stroke-width="2.5"/><circle class="ant" cx="50" cy="7" r="4.5" fill="#f1c978"/>
<rect class="al" x="12" y="72" width="11" height="25" rx="5.5" fill="url(#mg)"/><rect class="ar" x="77" y="72" width="11" height="25" rx="5.5" fill="url(#mg)"/>
<ellipse cx="40" cy="111" rx="9" ry="5" fill="#e0553f"/><ellipse cx="60" cy="111" rx="9" ry="5" fill="#e0553f"/><ellipse cx="50" cy="92" rx="25" ry="21" fill="url(#mg)"/><circle cx="50" cy="92" r="6" fill="#0f1722"/><circle cx="50" cy="92" r="2.5" fill="#f1c978"/>
<circle cx="14" cy="47" r="6" fill="#e0553f"/><circle cx="86" cy="47" r="6" fill="#e0553f"/><rect x="16" y="20" width="68" height="54" rx="26" fill="url(#mg)"/><ellipse cx="36" cy="28" rx="11" ry="4" fill="#fff" opacity=".28" transform="rotate(-20 36 28)"/>
<rect x="24" y="33" width="52" height="28" rx="14" fill="#0c121b"/><g class="ey"><ellipse class="eye" cx="40" cy="48" rx="4.6" ry="6" fill="#bff3ff"/><ellipse class="eye" cx="60" cy="48" rx="4.6" ry="6" fill="#bff3ff"/><path d="M43 55 Q50 62 57 55" stroke="#bff3ff" fill="none" stroke-width="1.8" stroke-linecap="round"/></g></svg></div></div>
 <div class="shapew" aria-hidden="true"><div class="shape"></div></div>
 <div class="cta-in">
  <h2 id="cta-h">Ready to Automate What Slows You Down?</h2>
  <p class="desc rv" style="--d:2">Tell us where the friction is. We'll help you shape practical systems around the way your team already works.</p>
  <div class="btnw rv" style="--d:2.3"><a class="btn" href="#contact"><span class="sw"></span>Start a Conversation <span class="ar" aria-hidden="true">→</span></a>
   <i class="pw" style="--a:-16deg;--d:4.6"><b></b></i><i class="pw" style="--a:-8deg;--d:4.8"><b></b></i><i class="pw" style="--a:0deg;--d:5"><b></b></i><i class="pw" style="--a:8deg;--d:5.2"><b></b></i><i class="pw" style="--a:16deg;--d:5.4"><b></b></i></div>
  <p class="sub rv" style="--d:2.6">No pressure. Just a conversation.</p>
 </div>
</section>
<button class="rp" id="rp">↻ Replay (preview)</button>
<script>
const cta=document.getElementById('cta'),h=document.getElementById('cta-h');
h.innerHTML='Ready to Automate What Slows You Down?'.split(' ').map((w,i)=>`<span class="w"><span style="--i:${i}">${w}</span></span>`).join(' ');
const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){io.disconnect();cta.setAttribute('data-on','')}},{threshold:.35});io.observe(cta);
new IntersectionObserver(e=>e[0].isIntersecting?cta.removeAttribute('data-off'):cta.setAttribute('data-off','')).observe(cta);
document.getElementById('rp').onclick=()=>{cta.removeAttribute('data-on');void cta.offsetWidth;requestAnimationFrame(()=>cta.setAttribute('data-on',''))};
</script></body></html>
