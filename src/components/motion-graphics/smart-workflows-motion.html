<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart workflows – automation flow</title>
<style>
:root{--page:#eef1f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#51627a;font:13px/1 system-ui,-apple-system,"Segoe UI",sans-serif}
body.dark{--page:#0b1220;color:#9db3d8}
body.check{background:#fff conic-gradient(#e4e8ee 25%,#fff 0 50%,#e4e8ee 0 75%,#fff 0) 0 0/24px 24px}
/* .stage = isolated scene: NO background of its own (transparent). 1600x1000 artboard, scales to fit. */
.stage{position:relative;width:100%;aspect-ratio:1600/1000;background:none;contain:layout paint}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ctl{display:none;gap:8px;align-items:center}
.ctl.off{display:none}
.ctl button,.ctl select{background:#fff;color:#33445c;border:1px solid #c5cfdd;border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer}
.ctl button:hover{background:#f1f5fb}
.ctl button:focus-visible,.ctl select:focus-visible{outline:2px solid #2f6df6;outline-offset:2px}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.o{transform-box:fill-box;transform-origin:50% 50%}
.ob{transform-box:fill-box;transform-origin:50% 100%}
.bell{transform-box:fill-box;transform-origin:50% 0}
.fl2{animation:fl2 6s ease-in-out infinite;animation-delay:calc(var(--i)*-1s)}
@keyframes fl2{50%{transform:translateY(-4px)}}
.gf{stroke-dasharray:6 18;animation:gf 2s linear infinite}
@keyframes gf{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.sp{transform-box:fill-box;transform-origin:50% 50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="stage" id="stage">
<svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated smart workflow: a new lead flows from CRM through communication and business data to team action, with status cards appearing at each step">
<defs>
<linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2b13a"/><stop offset="1" stop-color="#ffd987"/></linearGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b2a3a" flood-opacity=".2"/></filter>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="lines"></g><g id="conns"></g><g id="juncs"></g><g id="nodes"></g><g id="cards"></g><g id="orbs"></g>
</svg>
</div>
<div class="ctl" id="ctl">
<button id="bp" type="button" aria-pressed="false">Pause</button>
<button id="br" type="button">Restart</button>
<select id="bg" aria-label="Preview background"><option value="">Light preview</option><option value="dark">Dark preview</option><option value="check">Transparency check</option></select>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),svg=$('scene'),stage=$('stage');
/* Timeline in seconds on a shared 12 s loop; every animated item starts and ends hidden/idle, so the loop closes cleanly. */
const K=(el,fr)=>el.animate(fr.map(([t,s])=>({offset:t/12,easing:'ease-in-out',...s})),{duration:12000,iterations:Infinity});
const hid={opacity:0,transform:'translateY(18px) scale(.92)'},vis={opacity:1,transform:'none'},out={opacity:0,transform:'translateY(-10px) scale(.96)'};
const H0=10.4,H1=11.3;
const show=(el,t0)=>K(el,[[0,hid],[t0,hid],[t0+.55,vis],[H0,vis],[H1,out],[12,hid]]);
const pop=(el,t)=>{const s=k=>({opacity:k?1:0,transform:`scale(${k||.3})`});K(el,[[0,s(0)],[t,s(0)],[t+.28,s(1.3)],[t+.5,s(1)],[H0,s(1)],[H1,s(0)],[12,s(0)]])};
const draw=(el,t0,t1)=>{const a={strokeDashoffset:100,opacity:0};K(el,[[0,a],[t0-.01,a],[t0,{strokeDashoffset:100,opacity:1}],[t1,{strokeDashoffset:0,opacity:1}],[H0,{strokeDashoffset:0,opacity:1}],[11.2,{strokeDashoffset:0,opacity:0}],[12,a]])};
const along=(el,x0,x1,t0,t1)=>{const a={opacity:0,transform:`translate(${x0}px,0)`};K(el,[[0,a],[t0,a],[t0+.1,{opacity:1,transform:`translate(${x0}px,0)`}],[t1-.1,{opacity:1,transform:`translate(${x1}px,0)`}],[t1,{opacity:0,transform:`translate(${x1}px,0)`}],[12,a]])};
/* ---------- geometry (1600x1000) ---------- */
const NY=370,LY=500,N=[
 {x:200,t:'CRM',s:['Capture & update','leads'],at:1.0},
 {x:540,t:'COMMUNICATION',s:['Send emails &','notifications'],at:2.0},
 {x:965,t:'BUSINESS DATA',s:['Sync and enrich','data'],at:3.5},
 {x:1370,t:'TEAM ACTION',s:['Create tasks &','assign to team'],at:6.7}];
const IC=[
`<g fill="#1da1de"><circle cx="-24" cy="6" r="17"/><circle cx="-4" cy="-8" r="24"/><circle cx="24" cy="-2" r="20"/><circle cx="36" cy="12" r="14"/><rect x="-38" y="4" width="76" height="20" rx="10"/></g><text y="14" text-anchor="middle" font-size="17" font-weight="700" font-style="italic" fill="#fff">crm</text>`,
`<g transform="translate(-56,0)"><rect x="-22" y="-16" width="44" height="32" rx="6" fill="#fff" stroke="#dfe5ee" stroke-width="2"/><path d="M-18,-10l18,13l18,-13" stroke="#ea4335" stroke-width="4" fill="none" stroke-linejoin="round"/></g><g stroke-width="7" stroke-linecap="round"><path d="M-8,-18v36" stroke="#36c5f0"/><path d="M8,-18v36" stroke="#2eb67d"/><path d="M-18,-6h36" stroke="#ecb22e"/><path d="M-18,8h36" stroke="#e01e5a"/></g><g transform="translate(56,0)"><rect x="-20" y="-14" width="40" height="28" rx="6" fill="#c8787b"/><path d="M-16,-8l16,12l16,-12" stroke="#fff" stroke-width="3.5" fill="none"/></g>`,
`<g fill="#2d4a66"><ellipse cy="-26" rx="30" ry="11"/><path d="M-30,-26v52c0,6 14,11 30,11s30,-5 30,-11v-52c0,6 -14,11 -30,11s-30,-5 -30,-11z"/></g><path d="M-30,-6c0,6 14,11 30,11s30,-5 30,-11M-30,14c0,6 14,11 30,11s30,-5 30,-11" stroke="#fff" stroke-opacity=".7" stroke-width="3" fill="none"/>`,
`<g transform="translate(-34,0)"><path d="M0,-26l24,24l-24,24l-12,-12l12,-12l-12,-12z" fill="#2684ff"/></g><g transform="translate(36,0)"><rect x="-24" y="-26" width="48" height="52" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="3"/><text y="10" text-anchor="middle" font-size="30" font-weight="800" fill="#1b2a3a">N</text></g>`];
let L='',Cn='',J='',ND='';
/* main flow line + continuous gold data dashes */
const ML=`M${N[0].x},${LY}H${N[3].x}`;
L=`<path d="${ML}" stroke="#f2b13a" stroke-opacity=".22" stroke-width="12" stroke-linecap="round"/><path d="${ML}" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity=".8"/><path d="${ML}" class="gf" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>`;
/* branch connectors: [path, draw start, draw end] */
const CP=[['M245,246C245,320 200,310 200,370',.7,1.3],['M860,331C860,360 965,340 965,370',3.6,4.0],['M1341,290C1341,330 1370,330 1370,370',6.8,7.2],['M540,650C540,710 309,690 309,750',2.1,2.7],['M965,650C965,690 834,672 834,712',5.9,6.4],['M1370,650C1370,710 1317,690 1317,750',7.6,8.1]];
CP.forEach(([d],i)=>Cn+=`<g class="cn"><path d="${d}" pathLength="100" stroke-dasharray="100" stroke="#f2b13a" stroke-opacity=".25" stroke-width="9" fill="none" stroke-linecap="round"/><path d="${d}" pathLength="100" stroke-dasharray="100" stroke="url(#gold)" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>`);
/* junctions between stages */
const JX=[370,752,1167];
JX.forEach(x=>J+=`<g transform="translate(${x},${LY})"><circle class="jr o" r="26" fill="none" stroke="#f2b13a" stroke-width="4" opacity="0"/><circle r="24" fill="#3b4250" stroke="#f2b13a" stroke-width="3"/><path d="M-6,-9l11,9l-11,9" stroke="#ffd987" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`);
/* stage nodes */
N.forEach((n,i)=>ND+=`<g transform="translate(${n.x},${NY})"><rect class="ng" x="-106" y="-6" width="212" height="292" rx="34" fill="none" stroke="#f2b13a" stroke-width="4" filter="url(#gl)" opacity="0"/>
<g filter="url(#ds)"><rect x="-100" width="200" height="280" rx="28" fill="#fff" fill-opacity=".88" stroke="#fff" stroke-width="2"/><rect x="-100" width="200" height="280" rx="28" fill="url(#hi)"/></g>
<g transform="translate(0,96)"><g class="ic o">${IC[i]}</g></g>
<text y="198" text-anchor="middle" font-size="23" font-weight="800" letter-spacing=".8" fill="#1b2a3a">${n.t}</text>
<text y="232" text-anchor="middle" font-size="18" fill="#64748b">${n.s[0]}</text><text y="256" text-anchor="middle" font-size="18" fill="#64748b">${n.s[1]}</text>
<circle cx="78" cy="26" r="11" fill="#cfd8e3"/><g class="gk o"><circle cx="78" cy="26" r="11" fill="#2fcf7a"/><path d="M72,26l4,4l8,-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`);
$('lines').innerHTML=L;$('conns').innerHTML=Cn;$('juncs').innerHTML=J;$('nodes').innerHTML=ND;
/* ---------- status cards ---------- */
const chk=(x,y)=>`<g class="ck o"><circle cx="${x}" cy="${y}" r="12" fill="#2fcf7a"/><path d="M${x-6},${y}l4,4l8,-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
const card=(i,x,y,w,h,dk,ic,ti,su,ex='',ck=1)=>`<g transform="translate(${x},${y})"><g class="fl2" style="--i:${i}"><g class="o cd" filter="url(#ds)"><rect width="${w}" height="${h}" rx="26" fill="${dk?'#34465a':'#fff'}" fill-opacity="${dk?.92:.88}" stroke="#fff" stroke-opacity=".75" stroke-width="2"/><rect width="${w}" height="${h}" rx="26" fill="url(#hi)"/>
<g transform="translate(52,56)">${ic}</g><text x="94" y="54" font-size="26" font-weight="700" fill="${dk?'#fff':'#1b2a3a'}">${ti}</text><text x="94" y="84" font-size="19" fill="${dk?'#b6c2d0':'#64748b'}">${su}</text>${ex}${ck?chk(w-30,28):''}</g></g></g>`;
const cir=(c,inner,s='')=>`<circle r="27" fill="${c}" ${s}/>${inner}`;
const ICs={
 bolt:cir('#e6efff','<path d="M5,-15l-13,17h10l-4,15l15,-19h-10z" fill="#2f6df6"/>','stroke="#2f6df6" stroke-width="3"'),
 db:cir('#2f6df6','<g fill="#fff"><ellipse cy="-9" rx="12" ry="5"/><path d="M-12,-7v14c0,3 5,5 12,5s12,-2 12,-5v-14c0,3 -5,5 -12,5s-12,-2 -12,-5z" opacity=".9"/></g>'),
 bell:cir('#ffd66b','<g class="bell"><path d="M0,-14c-8,0 -11,6 -11,12v7l-4,4h30l-4,-4v-7c0,-6 -3,-12 -11,-12z" fill="#e08a00"/><circle cy="14" r="3.5" fill="#e08a00"/></g>'),
 mail:cir('#e3edff','<rect x="-15" y="-11" width="30" height="22" rx="4" fill="#fff" stroke="#6b84a8" stroke-width="2.5"/><path d="M-12,-6l12,9l12,-9" stroke="#6b84a8" stroke-width="2.5" fill="none"/>'),
 chart:cir('#3b6fd8','<g fill="#fff"><rect x="-14" y="2" width="7" height="12" rx="1.5"/><rect x="-3" y="-6" width="7" height="20" rx="1.5"/><rect x="8" y="-14" width="7" height="28" rx="1.5"/></g>'),
 team:cir('#3b6fd8','<g fill="#fff"><circle cx="-8" cy="-6" r="6"/><circle cx="9" cy="-4" r="5"/><path d="M-19,13c0,-8 5,-11 11,-11s11,3 11,11zM3,13c0,-6 3,-9 8,-9s8,3 8,9z"/></g>')};
const rows=['Find company info','Get key details','Match with existing records'];
const TK=[4.6,5.2,5.8];
const enx=rows.map((r,k)=>`<g transform="translate(40,${128+k*40})"><circle class="spn" r="11" fill="none" stroke="#f6c35b" stroke-opacity=".3" stroke-width="3"/><circle class="sp spk" r="11" fill="none" stroke="#f6c35b" stroke-width="3" stroke-dasharray="18 60"/><g class="tk o"><circle r="11" fill="#2fcf7a"/><path d="M-5,0l4,4l7,-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="26" y="7" font-size="20" fill="#e6edf5">${r}</text></g>`).join('');
const dux=`<g fill="#7fb2ff" opacity=".95" id="dub">${[0,1,2,3,4,5,6,7].map(k=>`<rect class="ob" x="${40+k*38}" y="${150-[14,22,18,30,26,40,34,50][k]}" width="22" height="${[14,22,18,30,26,40,34,50][k]}" rx="4"/>`).join('')}</g><path class="ln" d="M44,138L116,128L154,134L230,112L268,118L342,96" pathLength="100" stroke-dasharray="100" stroke="#ffd987" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
const tax=`<g transform="translate(40,128)">${[0,1,2].map(k=>`<circle cx="${k*30}" r="15" fill="${['#8fb8ff','#ffd66b','#8ee0b4'][k]}" stroke="#34465a" stroke-width="3"/>`).join('')}</g>`;
$('cards').innerHTML=
 card(0,80,116,330,130,0,ICs.bolt,'New Lead Created','A new lead is added','',0).replace('A new lead is added</text>','A new lead is added</text><text x="94" y="106" font-size="19" fill="#64748b">in your CRM</text>')+
 card(1,626,116,350,215,1,ICs.db,'Enriching data...','',enx,1).replace(/<text x="94" y="84"[^>]*><\/text>/,'')+
 card(2,1176,165,330,125,0,ICs.bell,'Task Created','Assigned to Sales Team','',0)+
 card(3,127,750,364,125,0,ICs.mail,'Welcome Email Sent','Sent to new lead')+
 card(4,648,712,372,170,1,ICs.chart,'Data Updated','Company details added',dux)+
 card(5,1132,750,370,150,1,ICs.team,'Task Assigned','Sales team notified',tax);
$('orbs').innerHTML=[0,1,2,3].map(k=>`<g class="orb"><circle cx="0" cy="${LY}" r="${k==3?14:10}" fill="#fff" stroke="#f2b13a" stroke-width="4" filter="url(#gl)"/></g>`).join('');
/* ---------- choreography ---------- */
const cds=[...document.querySelectorAll('.cd')],T0=[.3,3.9,7.1,2.5,6.2,7.9];
cds.forEach((c,i)=>show(c,T0[i]));
document.querySelectorAll('#conns .cn').forEach((g,i)=>g.querySelectorAll('path').forEach(p=>draw(p,CP[i][1],CP[i][2])));
const gks=[...document.querySelectorAll('.gk')],ngs=[...document.querySelectorAll('.ng')],ics=[...document.querySelectorAll('.ic')];
N.forEach((n,i)=>{const t=n.at,O=v=>({opacity:v});
 K(ngs[i],[[0,O(0)],[t,O(0)],[t+.4,O(1)],[H0,O(1)],[11.6,O(0)],[12,O(0)]]);pop(gks[i],t+.2);
 const sc=v=>({transform:`scale(${v})`});K(ics[i],[[0,sc(1)],[t,sc(1)],[t+.25,sc(1.1)],[t+.6,sc(1)],[12,sc(1)]])});
document.querySelectorAll('.jr').forEach((r,i)=>{const t=[1.65,3.15,6.35][i],a={opacity:0,transform:'scale(1)'};K(r,[[0,a],[t,a],[t+.05,{opacity:.9,transform:'scale(1)'}],[t+.6,{opacity:0,transform:'scale(2)'}],[12,a]])});
const orbs=[...document.querySelectorAll('.orb')];
along(orbs[0],200,540,1.3,2.0);along(orbs[1],540,965,2.8,3.5);along(orbs[2],965,1370,6.0,6.7);along(orbs[3],200,1370,9.0,10.0);
/* card details */
const cks=[...document.querySelectorAll('.ck')];[8,7,3.1,6.2].forEach(()=>{});
// ck order in DOM: Enriching, Welcome, Data Updated, Task Assigned
[6.2,3.1,7.4,8.6].forEach((t,i)=>pop(cks[i],t));
document.querySelectorAll('.tk').forEach((g,k)=>pop(g,TK[k]));
document.querySelectorAll('.spk,.spn').forEach((c,j)=>{const k=j>>1,t=TK[k]??TK[j%3];});
[...document.querySelectorAll('.spk')].forEach((c,k)=>K(c,[[0,{opacity:0}],[3.9,{opacity:0}],[4.3,{opacity:1}],[TK[k]-.05,{opacity:1}],[TK[k]+.1,{opacity:0}],[12,{opacity:0}]]));
[...document.querySelectorAll('.spn')].forEach((c,k)=>K(c,[[0,{opacity:0}],[3.9,{opacity:0}],[4.3,{opacity:1}],[TK[k]-.05,{opacity:1}],[TK[k]+.1,{opacity:0}],[12,{opacity:0}]]));
document.querySelectorAll('#dub rect').forEach((b,k)=>{const r={transform:'scaleY(0)'},v={transform:'scaleY(1)'},t=6.6+k*.09;K(b,[[0,r],[t,r],[t+.4,v],[H0,v],[H1,r],[12,r]])});
{const l=document.querySelector('.ln'),a={strokeDashoffset:100,opacity:0};K(l,[[0,a],[6.9,a],[7.0,{strokeDashoffset:100,opacity:1}],[7.8,{strokeDashoffset:0,opacity:1}],[H0,{strokeDashoffset:0,opacity:1}],[H1,{strokeDashoffset:0,opacity:0}],[12,a]])}
{const b=document.querySelector('.bell'),R=v=>({transform:`rotate(${v}deg)`});K(b,[[0,R(0)],[7.6,R(0)],[7.75,R(-18)],[7.9,R(16)],[8.05,R(-12)],[8.2,R(10)],[8.35,R(0)],[12,R(0)]])}

/* ---------- controls ---------- */
const bp=$('bp'),sel=$('bg'),q=new URLSearchParams(location.search);
const anims=()=>svg.getAnimations({subtree:true});
let user=false,seen=true;
const apply=()=>{const stop=user||!seen||document.hidden;anims().forEach(a=>stop?a.pause():a.play())};
const setUser=v=>{user=v;bp.textContent=v?'Resume':'Pause';bp.setAttribute('aria-pressed',v);apply()};
bp.onclick=()=>setUser(!user);
$('br').onclick=()=>{anims().forEach(a=>a.currentTime=0);setUser(false)};
const setBg=v=>{document.body.classList.toggle('dark',v==='dark');document.body.classList.toggle('check',v==='check');sel.value=v};
sel.onchange=()=>setBg(sel.value);
if(q.get('bg'))setBg(q.get('bg'));
if(q.get('controls')==='0'){$('ctl').classList.add('off');document.body.style.background='transparent'}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){anims().forEach(a=>a.currentTime=a.effect.getTiming().duration===12000?9600:0);setUser(true)}
new IntersectionObserver(e=>{seen=e[0].isIntersecting;apply()}).observe(stage);
document.addEventListener('visibilitychange',apply);
window.__anims=anims;
})();
</script>
</body>
</html>
