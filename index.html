    <script>
    (function () {
      'use strict';
      var html = document.documentElement;
      var root = document.getElementById('am-loader');
      if (!root) { html.classList.remove('am-boot'); return; }
    
      /* ---- tuning (override with window.AM_LOADER_CONFIG before this script) ---- */
      var cfg = {
        rateEarly: 2.2,        // speed-up if the site is ready while the outline is still drawing
        rateLate: 1.4,         // speed-up if the site becomes ready later (animation otherwise ALWAYS runs at 1x)
        fontsTimeout: 2500,    // essential readiness: fonts, capped
        imagesTimeout: 3000,   // essential readiness: above-the-fold images, capped
        slowAfter: 5000,       // show a reassuring status line while the site is still loading
        longAfter: 50000,      // slow-connection message + "Continue anyway" / "Try again"
        giveUpAfter: 60000,    // enter the site anyway (if anything has rendered)
        reducedHold: 400,
        // anything matching these inside #root counts as "still loading" and is hidden behind the mascot
        spinnerSelectors: '.spinner-border,.spinner-grow,.spinner,.loader,.loading,.preloader,[class*="spinner"],[role="progressbar"],[aria-busy="true"]',
        text: {
          slow: [
            'Establishing a connection to AutomateMind\u2026',
            'Waiting for the network to respond\u2026',
            'The connection is taking a little longer than usual\u2026',
            'Still reaching the services needed to load your experience\u2026'
          ],
          long: 'Your connection may be taking longer than expected. We\u2019re still preparing AutomateMind \u2014 you can keep waiting or continue anyway.',
          offline: 'You appear to be offline. Please reconnect to continue your AutomateMind experience.',
          stuck: 'We\u2019re having trouble reaching AutomateMind. Please check your connection and try again.'
        }
      };
      var user = window.AM_LOADER_CONFIG;
      if (user) for (var k in user) if (Object.prototype.hasOwnProperty.call(user, k)) {
        if (k === 'text' && typeof user.text === 'object') { for (var t in user.text) cfg.text[t] = user.text[t]; }
        else cfg[k] = user[k];
      }
    
      var app = document.getElementById('root');
      var noteEl = root.querySelector('.am-note__t');
      var actionsEl = root.querySelector('.am-actions');
      var contBtn = root.querySelector('[data-am="continue"]');
      var reloadBtn = root.querySelector('[data-am="reload"]');
      var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      var S = { ready: false, drawDone: false, done: false, mounted: false, stuck: false, forced: false, rate: 1, stage: 'draw', note: 0 };
      var timers = [];
      var mo = null;
      var t0 = performance.now();
      var doneCbs = [];
    
      function later(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
      function wait(ms) { return new Promise(function (r) { later(r, ms); }); }
    
      /* ---- keep visitors out of the page while the loader is up ---- */
      function block(e) {
        if (e.type === 'keydown') {
          if (e.target && e.target.closest && e.target.closest('.am-actions')) return;   // keep the buttons usable
          if ([32, 33, 34, 35, 36, 37, 38, 39, 40].indexOf(e.keyCode) < 0) return;
        }
        e.preventDefault();
      }
      window.addEventListener('wheel', block, { passive: false });
      window.addEventListener('touchmove', block, { passive: false });
      window.addEventListener('keydown', block);
      if (app) app.setAttribute('inert', '');
    
      function release() {
        window.removeEventListener('wheel', block);
        window.removeEventListener('touchmove', block);
        window.removeEventListener('keydown', block);
        root.style.pointerEvents = 'none';
      }
      function reveal() {                       // let the page show (it is already laid out underneath)
        html.classList.remove('am-boot');
        if (app) app.removeAttribute('inert');
      }
    
      function finish() {
        if (S.done) return;
        S.done = true;
        release(); reveal();
        timers.forEach(clearTimeout);
        if (mo) mo.disconnect();
        root.removeEventListener('animationend', onEnd);
        window.removeEventListener('pageshow', onShow);
        window.removeEventListener('online', updateNote);
        window.removeEventListener('offline', updateNote);
        if (root.parentNode) root.parentNode.removeChild(root);
        doneCbs.forEach(function (cb) { try { cb(); } catch (e) {} });
        window.dispatchEvent(new Event('amloader:done'));
      }
      function fadeOutNow(ms) {
        release(); reveal();
        root.style.transition = 'opacity ' + ms + 'ms ease';
        root.style.opacity = '0';
        later(finish, ms + 60);
      }
    
      /* ---- timeline: one playback rate for every loader animation ---- */
      function applyRate() {
        if (!root.getAnimations) return;
        root.getAnimations({ subtree: true }).forEach(function (a) { try { a.updatePlaybackRate(S.rate); } catch (e) {} });
      }
      function go(stage) {
        S.stage = stage;
        root.classList.remove('s-wait');
        root.classList.add('s-' + stage);
        if (stage === 'exit') { reveal(); release(); }   // site is usable as soon as the exit begins
        applyRate();
      }
    
      // draw -> detail -> color -> alive -> (wait, only while the site is not ready) -> wave -> exit
      var NEXT = { draw: 'detail', detail: 'color', color: 'alive', wave: 'exit' };
      function onEnd(e) {
        var id = e.target && e.target.id;
        if (!id || id.indexOf('am-e-') !== 0 || S.done) return;
        var stage = id.slice(5);
        if (stage === 'draw') S.drawDone = true;
        if (stage === 'alive') go(S.ready ? 'wave' : 'wait');
        else if (stage === 'exit') finish();
        else if (NEXT[stage]) go(NEXT[stage]);
      }
      root.addEventListener('animationend', onEnd);
    
      /* ---- what counts as "the site is here" ---- */
      function isShown(el) {
        if (el.closest && el.closest('[data-am-ignore]')) return false;
        var r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      }
      function hasSpinner() {
        if (!app) return false;
        var list;
        try { list = app.querySelectorAll(cfg.spinnerSelectors); } catch (e) { return false; }
        for (var i = 0; i < list.length; i++) if (isShown(list[i])) return true;
        return false;
      }
      function rootHasContent() { return !app || (app.childElementCount > 0 && !hasSpinner()); }
    
      function untilNoSpinner() {
        return new Promise(function (res) {
          (function poll() { if (S.done || !hasSpinner()) return res(); later(poll, 250); })();
        });
      }
      function imagesReady() {
        var vh = window.innerHeight || 800;
        var imgs = [].slice.call(document.querySelectorAll('#root img, [data-am-critical]')).filter(function (el) {
          if (el.hasAttribute('data-am-critical')) return true;
          if (el.loading === 'lazy') return false;
          var r = el.getBoundingClientRect();
          return r.width > 0 && r.bottom > 0 && r.top < vh;
        });
        return Promise.all(imgs.map(function (img) {
          if (img.complete && img.naturalWidth) return img.decode ? img.decode().catch(function () {}) : 0;
          return new Promise(function (res) { img.addEventListener('load', res, { once: true }); img.addEventListener('error', res, { once: true }); });
        }));
      }
    
      function markReady(force) {
        if (S.ready || S.done) return;
        if (!force && !rootHasContent()) return;          // nothing rendered yet, or only a spinner: keep waiting
        S.ready = true;
        updateNote();
        if (reduce) {
          later(function () { fadeOutNow(280); }, Math.max(0, cfg.reducedHold - (performance.now() - t0)));
          return;
        }
        S.rate = S.drawDone ? cfg.rateLate : cfg.rateEarly;   // before this moment the rate is always 1x
        applyRate();
        if (S.stage === 'wait') go('wave');
      }
    
      // Called by the React app once its first screen is mounted (see loaderBridge.js).
      function appMounted() {
        if (S.mounted || S.done) return;
        S.mounted = true;
        var fonts = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, wait(cfg.fontsTimeout)]) : Promise.resolve();
        var go2 = function () { markReady(false); };
        fonts.then(function () { return Promise.race([imagesReady(), wait(cfg.imagesTimeout)]); })
             .then(untilNoSpinner)
             .then(go2, go2);
      }
    
      // Safety net if the bridge call is forgotten: real content in #root that stays put for a moment counts as mounted.
      if (app && window.MutationObserver) {
        var tid;
        var check = function () { clearTimeout(tid); tid = setTimeout(function () { if (!S.done && rootHasContent()) appMounted(); }, 900); };
        mo = new MutationObserver(check);
        mo.observe(app, { childList: true, subtree: true });
        check();
      }
    
      /* ---- slow / offline messages from the mascot ---- */
      function tier() {
        if (S.ready || S.done) return 0;
        if (S.stuck) return 'stuck';
        if (navigator.onLine === false) return 'offline';
        var t = performance.now() - t0;
        if (t >= cfg.longAfter) return 'long';
        if (t >= cfg.slowAfter) return 'slow';
        return 0;
      }
      function updateNote() {
        var k = tier();
        var slowMessages = Array.isArray(cfg.text.slow) ? cfg.text.slow : [cfg.text.slow];
        var slowIndex = k === 'slow' ? Math.floor((performance.now() - t0 - cfg.slowAfter) / 4000) % slowMessages.length : 0;
        var noteKey = k === 'slow' ? k + ':' + slowIndex : k;
        if (noteKey === S.note) return;
        S.note = noteKey;
        root.classList.remove('s-note1', 's-note2');
        if (!k) { noteEl.textContent = ''; actionsEl.hidden = true; return; }
        root.classList.add('s-note1');
        if (k !== 'slow') root.classList.add('s-note2');
        noteEl.textContent = k === 'slow' ? slowMessages[slowIndex] : cfg.text[k];
        actionsEl.hidden = (k === 'slow');
        contBtn.hidden = (k === 'stuck');                 // nothing rendered yet: only "Try again" makes sense
      }
      function forceEnter() { if (!S.ready && !S.done) { S.forced = true; markReady(true); } }
      contBtn.addEventListener('click', forceEnter);
      reloadBtn.addEventListener('click', function () { location.reload(); });
      window.addEventListener('online', updateNote);
      window.addEventListener('offline', updateNote);
      later(updateNote, cfg.slowAfter);
      later(function rotateSlowMessage() {
        if (S.done || tier() !== 'slow') return;
        updateNote();
        later(rotateSlowMessage, 4000);
      }, cfg.slowAfter + 4000);
      later(updateNote, cfg.longAfter);
      later(function () {                                  // never trap the visitor
        if (S.ready || S.done) return;
        if (rootHasContent()) forceEnter(); else { S.stuck = true; updateNote(); }
      }, cfg.giveUpAfter);
      updateNote();
    
      function onShow(e) { if (e.persisted && !S.done) finish(); }   // bfcache restore: never replay
      window.addEventListener('pageshow', onShow);
      if (reduce) root.classList.add('s-static');
    
      window.AMLoader = {
        appMounted: appMounted,
        ready: function () { markReady(true); },
        onDone: function (cb) { if (S.done) cb(); else doneCbs.push(cb); },
        get active() { return !S.done; }
      };
    })();
    </script>
