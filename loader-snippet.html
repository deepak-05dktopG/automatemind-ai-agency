<!-- ============================================================
  AutomateMind mascot loader — paste in two places in index.html
  ============================================================ -->

<!-- 1) inside <head>, as early as possible -->
<meta name="theme-color" content="#071522">
<script>document.documentElement.classList.add('am-boot')</script>
<style id="am-loader-css">
/* ===== AutomateMind mascot loader — critical CSS (inline in <head>) ===== */
#am-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#071522;color:#E9E2D0;overflow:hidden;touch-action:none;overscroll-behavior:contain;animation:am-fs 0s linear 90s forwards}
@keyframes am-fs{to{visibility:hidden;pointer-events:none}}
/* While the loader runs, nothing else on the page (spinners, preloaders, overlays) can show.
   The page itself keeps its layout, so nothing shifts when it is revealed. */
html.am-boot #root{visibility:hidden;animation:am-unhide 0s linear 95s forwards}
html.am-boot body>*:not(#am-loader):not(#root):not(script):not(style):not(link):not(meta):not(noscript){visibility:hidden}
@keyframes am-unhide{to{visibility:visible}}
#am-loader *{box-sizing:border-box}
#am-loader .am-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#am-loader .am-sent{position:absolute;width:0;height:0;visibility:hidden}
.am-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vh,16px)}
.am-svg{display:block;width:min(66vw,46vh,340px);height:auto;overflow:visible}
.am-text{display:grid;justify-items:center;align-items:start;width:min(88vw,430px);min-height:7.4em}
.am-text>*{grid-area:1/1}
.am-welcome{margin:0;text-align:center;opacity:0}
.am-note{width:100%;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s ease}
.am-note__t{margin:0;font:500 clamp(13px,2.5vw,15px)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;color:#D8B66A}
.am-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin-top:.8rem}
.am-actions[hidden]{display:none}
.am-actions button{font:600 .8rem system-ui,-apple-system,"Segoe UI",sans-serif;color:#D8B66A;background:transparent;border:1px solid rgba(216,182,106,.6);border-radius:999px;padding:.5rem 1.1rem;cursor:pointer;pointer-events:auto;transition:background .2s,border-color .2s}
.am-actions button:hover{background:rgba(216,182,106,.12);border-color:#D8B66A}
.am-actions button:focus-visible{outline:2px solid #D8B66A;outline-offset:3px}
.am-w1{display:block;font:600 clamp(28px,5.6vw,38px)/1.1 "Cormorant Garamond",Georgia,"Times New Roman",serif;color:#D8B66A;letter-spacing:.01em}
.am-w2{display:block;margin-top:.25em;font:500 clamp(14px,2.6vw,17px)/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.05em;color:#E8E4D8}

/* line art */
.lines{filter:drop-shadow(0 0 2px rgba(198,161,91,.35))}
.seg{stroke-dasharray:1;stroke-dashoffset:0}
.seg2{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.seg2.cy{stroke:#8DEBFF}
.am-tip{fill:#FFE9A8;opacity:0;filter:drop-shadow(0 0 5px #D8B66A)}
.am-wipe{transform:translateX(430px)}
.am-wline{transform:translateX(450px);opacity:0;filter:drop-shadow(0 0 6px #D8B66A)}
.sparkle{opacity:0;transform-box:fill-box;transform-origin:center}

/* pivots for the "comes alive" stage */
.p-bounce{transform-origin:200px 412px}
.p-head{transform-origin:200px 275px}
.p-ant{transform-origin:200px 100px}
.eyes-g{transform-origin:200px 192px}
.chest-dot{transform-origin:200px 330px}
.arm{transform-origin:0 -30px}

/* A — line drawing (starts immediately: the class is in the markup) */
.s-draw .seg{animation:am-draw var(--t,.5s) cubic-bezier(.45,.05,.3,1) var(--d,0s) both}
@supports (offset-path:path('M0 0')){.s-draw .am-tip{animation:am-tip var(--t,.5s) cubic-bezier(.45,.05,.3,1) var(--d,0s) both}}
.s-draw #am-e-draw{animation:am-end 3.7s linear both}
@keyframes am-draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes am-tip{0%{offset-distance:0%;opacity:0}6%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes am-end{from{opacity:0}to{opacity:0}}

/* idle: outline complete, still waiting for the site */
.s-idle .lines{animation:am-breathe 2.6s ease-in-out infinite}
@keyframes am-breathe{0%,100%{filter:drop-shadow(0 0 2px rgba(198,161,91,.3))}50%{filter:drop-shadow(0 0 7px rgba(216,182,106,.8))}}

/* B — complete the outline */
.s-detail .lines{animation:am-pulse .9s ease both}
.s-detail .seg2{animation:am-draw var(--t,.5s) cubic-bezier(.45,.05,.3,1) var(--d,0s) both}
.s-detail #am-e-detail{animation:am-end 1.2s linear both}
@keyframes am-pulse{0%,100%{filter:drop-shadow(0 0 2px rgba(198,161,91,.35));stroke:#C6A15B}45%{filter:drop-shadow(0 0 9px rgba(216,182,106,.95));stroke:#D8B66A}}

/* C — colour reveal (right-to-left wipe, as in the storyboard) */
.s-color .am-wipe{animation:am-wipe 1s cubic-bezier(.55,0,.25,1) both}
.s-color .am-wline{animation:am-wline 1s cubic-bezier(.55,0,.25,1) both}
.s-color .lines{animation:am-linesout .8s ease .5s both}
.s-color #am-e-color{animation:am-end 1.3s linear both}
@keyframes am-wipe{from{transform:translateX(430px)}to{transform:translateX(-60px)}}
@keyframes am-wline{0%{transform:translateX(430px);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateX(-60px);opacity:0}}
@keyframes am-linesout{to{opacity:0}}

/* D — the mascot comes alive */
.s-alive .p-bounce{animation:am-settle .8s ease-out .1s both}
.s-alive .eyes-g{animation:am-blink .32s ease .35s both}
.s-alive .p-ant{animation:am-ant 1s ease-in-out .2s both}
.s-alive .p-head{animation:am-tilt 1.2s ease-in-out .3s both}
.s-alive .arm-l{animation:am-open-l .6s ease-out .5s both}
.s-alive .arm-r{animation:am-open-r .6s ease-out .5s both}
.s-alive .chest-dot{animation:am-chest .7s ease-in-out .9s both}
.s-alive #am-e-alive{animation:am-end 1.6s linear both}
@keyframes am-settle{0%{transform:scale(1,1)}30%{transform:scale(1.03,.95)}60%{transform:scale(.985,1.025)}100%{transform:scale(1,1)}}
@keyframes am-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
@keyframes am-ant{0%,100%{transform:rotate(0)}25%{transform:rotate(7deg)}55%{transform:rotate(-5deg)}80%{transform:rotate(2deg)}}
@keyframes am-tilt{0%,100%{transform:rotate(0)}40%,65%{transform:rotate(-4deg)}}
@keyframes am-open-l{from{transform:rotate(0)}to{transform:rotate(16deg)}}
@keyframes am-open-r{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
@keyframes am-chest{0%,100%{transform:scale(1)}45%{transform:scale(1.55)}}

/* waiting: the mascot is fully alive but the site is not ready yet — calm loop, same speed as everything else */
.s-wait .p-head{animation:am-wait-head 4s ease-in-out infinite}
.s-wait .p-ant{animation:am-wait-ant 3s ease-in-out infinite}
.s-wait .chest-dot{animation:am-wait-chest 2.4s ease-in-out infinite}
.s-wait .eyes-g{animation:am-wait-blink 4.5s ease-in-out infinite}
@keyframes am-wait-head{0%,100%{transform:rotate(0)}30%{transform:rotate(-2.5deg)}70%{transform:rotate(2deg)}}
@keyframes am-wait-ant{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes am-wait-chest{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes am-wait-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

/* slow connection: the mascot "searches for signal"; very slow: a small shrug */
.signal{opacity:0}
.s-note1 .signal{opacity:1}
.s-note1 .signal path{animation:am-signal 1.8s ease-in-out infinite;opacity:.15}
.s-note1 .signal path:nth-child(2){animation-delay:.25s}
.s-note1 .signal path:nth-child(3){animation-delay:.5s}
.s-note1 .am-note{opacity:1}
.s-note2 .arm-l{animation:am-shrug-l 3.2s ease-in-out infinite}
.s-note2 .arm-r{animation:am-shrug-r 3.2s ease-in-out infinite}
@keyframes am-signal{0%,100%{opacity:.15}35%{opacity:1}}
@keyframes am-shrug-l{0%,100%{transform:rotate(16deg)}35%,60%{transform:rotate(36deg)}}
@keyframes am-shrug-r{0%,100%{transform:rotate(-16deg)}35%,60%{transform:rotate(-36deg)}}

/* E — welcome wave, nod, sparkle, real HTML text */
.s-wave .arm-r{animation:am-wave 1.5s ease-in-out both}
.s-wave .p-head{animation:am-nod 1.7s ease-in-out both}
.s-wave .sparkle{animation:am-spark 1.3s ease-in-out .35s both}
.s-wave .sparkle--2{animation-delay:.6s}
.s-wave .am-welcome{animation:am-text .7s ease .2s both}
.s-wave #am-e-wave{animation:am-end 1.8s linear both}
@keyframes am-wave{0%{transform:rotate(-16deg)}22%{transform:rotate(-100deg)}34%{transform:rotate(-86deg)}46%{transform:rotate(-112deg)}58%{transform:rotate(-88deg)}70%{transform:rotate(-110deg)}84%{transform:rotate(-100deg)}100%{transform:rotate(-16deg)}}
@keyframes am-nod{0%,70%{transform:rotate(0) translateY(0)}82%{transform:rotate(3deg) translateY(6px)}94%,100%{transform:rotate(0) translateY(0)}}
@keyframes am-spark{0%{opacity:0;transform:scale(.3) rotate(0)}30%{opacity:1;transform:scale(1.1) rotate(10deg)}60%{opacity:.9;transform:scale(.9) rotate(20deg)}100%{opacity:0;transform:scale(.4) rotate(45deg)}}
@keyframes am-text{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* F — transition into the website */
#am-loader.s-exit{pointer-events:none;animation:am-fade .8s ease .2s both}
.s-exit .am-stage{animation:am-up 1s cubic-bezier(.5,0,.2,1) both}
.s-exit .am-sweep{animation:am-sweep .95s ease-in-out both}
.s-exit .am-trail{animation:am-trail 1s ease-out both}
.s-exit #am-e-exit{animation:am-end 1.05s linear both}
.am-sweep{position:absolute;left:-10%;right:-10%;top:66%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(216,182,106,.9) 50%,transparent);box-shadow:0 0 14px rgba(216,182,106,.5);opacity:0;transform:translateX(-110%) rotate(-2deg)}
.am-trail{position:absolute;left:50%;top:66%;width:5px;height:0;margin-left:-2.5px;border-radius:5px;background:linear-gradient(to bottom,rgba(216,182,106,0),rgba(216,182,106,.85));opacity:0}
@keyframes am-up{from{transform:translateY(0) scale(1)}to{transform:translateY(-8vh) scale(1.07)}}
@keyframes am-fade{to{opacity:0}}
@keyframes am-sweep{0%{opacity:0;transform:translateX(-110%) rotate(-2deg)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(110%) rotate(-2deg)}}
@keyframes am-trail{0%{opacity:0;height:0;transform:translateY(0)}35%{opacity:1}100%{opacity:0;height:110px;transform:translateY(40px)}}

/* reduced motion: a calm, finished mascot, then a quick fade (JS adds .s-static) */
@media (prefers-reduced-motion:reduce){#am-loader,#am-loader *{animation:none!important}}
.s-static .am-fill{mask:none}
.s-static .lines,.s-static .sparkle,.s-static .am-wline{display:none}
.s-static .am-welcome{opacity:1}
.s-static .am-note{display:none}
.s-static.s-note1 .am-welcome{opacity:0}
.s-static.s-note1 .am-note{display:block}
</style>
<noscript><style>#am-loader{display:none!important}</style></noscript>

        <path class="seg2 cy" pathLength="1" style="--d:0.15s;--t:0.45s" d="M152 192A14 19 0 1 1 180 192A14 19 0 1 1 152 192Z"/><path class="seg2 cy" pathLength="1" style="--d:0.3s;--t:0.45s" d="M220 192A14 19 0 1 1 248 192A14 19 0 1 1 220 192Z"/><path class="seg2 cy" pathLength="1" style="--d:0.5s;--t:0.4s" d="M186 216Q200 230 214 216"/><path class="seg2 " pathLength="1" style="--d:0.7s;--t:0.3s" d="M194 330A6 6 0 1 1 206 330A6 6 0 1 1 194 330Z"/>
      </g>

      <g class="signal" fill="none" stroke="#D8B66A" stroke-width="2.4" stroke-linecap="round"><path d="M193.6 33.6A9 9 0 0 1 206.4 33.6"/><path d="M188 28A17 17 0 0 1 212 28"/><path d="M182.3 22.3A25 25 0 0 1 217.7 22.3"/></g>
      <rect class="am-wline" x="21" y="-20" width="2" height="500" fill="url(#am-gLine)"/>
      <path class="sparkle" d="M352 98l4.5 15.5L372 118l-15.5 4.5L352 138l-4.5-15.5L332 118l15.5-4.5z" fill="#F5D27A"/>
      <path class="sparkle sparkle--2" d="M376 150l2.6 8.4 8.4 2.6-8.4 2.6-2.6 8.4-2.6-8.4-8.4-2.6 8.4-2.6z" fill="#F5D27A"/>
    </svg>
    <div class="am-text">
      <p class="am-welcome"><span class="am-w1">Welcome</span><span class="am-w2">to AutomateMind</span></p>
      <div class="am-note">
        <p class="am-note__t"></p>
        <div class="am-actions" hidden><button type="button" data-am="continue">Continue anyway</button><button type="button" data-am="reload">Try again</button></div>
      </div>
    </div>
    <i class="am-trail" aria-hidden="true"></i>
  </div>
  <i class="am-sweep" aria-hidden="true"></i>
  <i class="am-sent" id="am-e-draw" aria-hidden="true"></i><i class="am-sent" id="am-e-detail" aria-hidden="true"></i><i class="am-sent" id="am-e-color" aria-hidden="true"></i><i class="am-sent" id="am-e-alive" aria-hidden="true"></i><i class="am-sent" id="am-e-wave" aria-hidden="true"></i><i class="am-sent" id="am-e-exit" aria-hidden="true"></i>
</div>
<script>
(function () {
  'use strict';
  var html = document.documentElement;
  var root = document.getElementById('am-loader');
  if (!root) { html.classList.remove('am-boot'); return; }

  /* ---- tuning (override with window.AM_LOADER_CONFIG before this script) ---- */
  var cfg = {
    rateEarly: 2.2,        // speed-up if the site is ready while the outline is still drawing
    rateLate: 1.4,         // speed-up if the site becomes ready later (animation otherwise ALWAYS runs at 1x)
    fontsTimeout: 2500,    // essential readiness: fonts, capped
    imagesTimeout: 3000,   // essential readiness: above-the-fold images, capped
    slowAfter: 6000,       // mascot starts telling the visitor it is taking longer than usual
    longAfter: 15000,      // slow-connection message + "Continue anyway" / "Try again"
    giveUpAfter: 45000,    // enter the site anyway (if anything has rendered)
    reducedHold: 400,
    // anything matching these inside #root counts as "still loading" and is hidden behind the mascot
    spinnerSelectors: '.spinner-border,.spinner-grow,.spinner,.loader,.loading,.preloader,[class*="spinner"],[role="progressbar"],[aria-busy="true"]',
    text: {
      slow: 'Taking a little longer than usual\u2026',
      long: 'Your connection seems slow. We\u2019re still loading \u2014 you can keep waiting or continue anyway.',
      offline: 'You appear to be offline. We\u2019ll continue as soon as your connection is back.',
      stuck: 'We couldn\u2019t load the site. Please check your connection and try again.'
    }
  };
  var user = window.AM_LOADER_CONFIG;
  if (user) for (var k in user) if (Object.prototype.hasOwnProperty.call(user, k)) {
    if (k === 'text' && typeof user.text === 'object') { for (var t in user.text) cfg.text[t] = user.text[t]; }
    else cfg[k] = user[k];
  }

  var app = document.getElementById('root');
  var noteEl = root.querySelector('.am-note__t');
  var actionsEl = root.querySelector('.am-actions');
  var contBtn = root.querySelector('[data-am="continue"]');
  var reloadBtn = root.querySelector('[data-am="reload"]');
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var S = { ready: false, drawDone: false, done: false, mounted: false, stuck: false, forced: false, rate: 1, stage: 'draw', note: 0 };
  var timers = [];
  var mo = null;
  var t0 = performance.now();
  var doneCbs = [];

  function later(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function wait(ms) { return new Promise(function (r) { later(r, ms); }); }

  /* ---- keep visitors out of the page while the loader is up ---- */
  function block(e) {
    if (e.type === 'keydown') {
      if (e.target && e.target.closest && e.target.closest('.am-actions')) return;   // keep the buttons usable
      if ([32, 33, 34, 35, 36, 37, 38, 39, 40].indexOf(e.keyCode) < 0) return;
    }
    e.preventDefault();
  }
  window.addEventListener('wheel', block, { passive: false });
  window.addEventListener('touchmove', block, { passive: false });
  window.addEventListener('keydown', block);
  if (app) app.setAttribute('inert', '');

  function release() {
    window.removeEventListener('wheel', block);
    window.removeEventListener('touchmove', block);
    window.removeEventListener('keydown', block);
    root.style.pointerEvents = 'none';
  }
  function reveal() {                       // let the page show (it is already laid out underneath)
    html.classList.remove('am-boot');
    if (app) app.removeAttribute('inert');
  }

  function finish() {
    if (S.done) return;
    S.done = true;
    release(); reveal();
    timers.forEach(clearTimeout);
    if (mo) mo.disconnect();
    root.removeEventListener('animationend', onEnd);
    window.removeEventListener('pageshow', onShow);
    window.removeEventListener('online', updateNote);
    window.removeEventListener('offline', updateNote);
    if (root.parentNode) root.parentNode.removeChild(root);
    doneCbs.forEach(function (cb) { try { cb(); } catch (e) {} });
    window.dispatchEvent(new Event('amloader:done'));
  }
  function fadeOutNow(ms) {
    release(); reveal();
    root.style.transition = 'opacity ' + ms + 'ms ease';
    root.style.opacity = '0';
    later(finish, ms + 60);
  }

  /* ---- timeline: one playback rate for every loader animation ---- */
  function applyRate() {
    if (!root.getAnimations) return;
    root.getAnimations({ subtree: true }).forEach(function (a) { try { a.updatePlaybackRate(S.rate); } catch (e) {} });
  }
  function go(stage) {
    S.stage = stage;
    root.classList.remove('s-wait');
    root.classList.add('s-' + stage);
    if (stage === 'exit') { reveal(); release(); }   // site is usable as soon as the exit begins
    applyRate();
  }

  // draw -> detail -> color -> alive -> (wait, only while the site is not ready) -> wave -> exit
  var NEXT = { draw: 'detail', detail: 'color', color: 'alive', wave: 'exit' };
  function onEnd(e) {
    var id = e.target && e.target.id;
    if (!id || id.indexOf('am-e-') !== 0 || S.done) return;
    var stage = id.slice(5);
    if (stage === 'draw') S.drawDone = true;
    if (stage === 'alive') go(S.ready ? 'wave' : 'wait');
    else if (stage === 'exit') finish();
    else if (NEXT[stage]) go(NEXT[stage]);
  }
  root.addEventListener('animationend', onEnd);

  /* ---- what counts as "the site is here" ---- */
  function isShown(el) {
    if (el.closest && el.closest('[data-am-ignore]')) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function hasSpinner() {
    if (!app) return false;
    var list;
    try { list = app.querySelectorAll(cfg.spinnerSelectors); } catch (e) { return false; }
    for (var i = 0; i < list.length; i++) if (isShown(list[i])) return true;
    return false;
  }
  function rootHasContent() { return !app || (app.childElementCount > 0 && !hasSpinner()); }

  function untilNoSpinner() {
    return new Promise(function (res) {
      (function poll() { if (S.done || !hasSpinner()) return res(); later(poll, 250); })();
    });
  }
  function imagesReady() {
    var vh = window.innerHeight || 800;
    var imgs = [].slice.call(document.querySelectorAll('#root img, [data-am-critical]')).filter(function (el) {
      if (el.hasAttribute('data-am-critical')) return true;
      if (el.loading === 'lazy') return false;
      var r = el.getBoundingClientRect();
      return r.width > 0 && r.bottom > 0 && r.top < vh;
    });
    return Promise.all(imgs.map(function (img) {
      if (img.complete && img.naturalWidth) return img.decode ? img.decode().catch(function () {}) : 0;
      return new Promise(function (res) { img.addEventListener('load', res, { once: true }); img.addEventListener('error', res, { once: true }); });
    }));
  }

  function markReady(force) {
    if (S.ready || S.done) return;
    if (!force && !rootHasContent()) return;          // nothing rendered yet, or only a spinner: keep waiting
    S.ready = true;
    updateNote();
    if (reduce) {
      later(function () { fadeOutNow(280); }, Math.max(0, cfg.reducedHold - (performance.now() - t0)));
      return;
    }
    S.rate = S.drawDone ? cfg.rateLate : cfg.rateEarly;   // before this moment the rate is always 1x
    applyRate();
    if (S.stage === 'wait') go('wave');
  }

  // Called by the React app once its first screen is mounted (see loaderBridge.js).
  function appMounted() {
    if (S.mounted || S.done) return;
    S.mounted = true;
    var fonts = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, wait(cfg.fontsTimeout)]) : Promise.resolve();
    var go2 = function () { markReady(false); };
    fonts.then(function () { return Promise.race([imagesReady(), wait(cfg.imagesTimeout)]); })
         .then(untilNoSpinner)
         .then(go2, go2);
  }

  // Safety net if the bridge call is forgotten: real content in #root that stays put for a moment counts as mounted.
  if (app && window.MutationObserver) {
    var tid;
    var check = function () { clearTimeout(tid); tid = setTimeout(function () { if (!S.done && rootHasContent()) appMounted(); }, 900); };
    mo = new MutationObserver(check);
    mo.observe(app, { childList: true, subtree: true });
    check();
  }

  /* ---- slow / offline messages from the mascot ---- */
  function tier() {
    if (S.ready || S.done) return 0;
    if (S.stuck) return 'stuck';
    if (navigator.onLine === false) return 'offline';
    var t = performance.now() - t0;
    if (t >= cfg.longAfter) return 'long';
    if (t >= cfg.slowAfter) return 'slow';
    return 0;
  }
  function updateNote() {
    var k = tier();
    if (k === S.note) return;
    S.note = k;
    root.classList.remove('s-note1', 's-note2');
    if (!k) { noteEl.textContent = ''; actionsEl.hidden = true; return; }
    root.classList.add('s-note1');
    if (k !== 'slow') root.classList.add('s-note2');
    noteEl.textContent = cfg.text[k];
    actionsEl.hidden = (k === 'slow');
    contBtn.hidden = (k === 'stuck');                 // nothing rendered yet: only "Try again" makes sense
  }
  function forceEnter() { if (!S.ready && !S.done) { S.forced = true; markReady(true); } }
  contBtn.addEventListener('click', forceEnter);
  reloadBtn.addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', updateNote);
  window.addEventListener('offline', updateNote);
  later(updateNote, cfg.slowAfter);
  later(updateNote, cfg.longAfter);
  later(function () {                                  // never trap the visitor
    if (S.ready || S.done) return;
    if (rootHasContent()) forceEnter(); else { S.stuck = true; updateNote(); }
  }, cfg.giveUpAfter);
  updateNote();

  function onShow(e) { if (e.persisted && !S.done) finish(); }   // bfcache restore: never replay
  window.addEventListener('pageshow', onShow);
  if (reduce) root.classList.add('s-static');

  window.AMLoader = {
    appMounted: appMounted,
    ready: function () { markReady(true); },
    onDone: function (cb) { if (S.done) cb(); else doneCbs.push(cb); },
    get active() { return !S.done; }
  };
})();
</script>
